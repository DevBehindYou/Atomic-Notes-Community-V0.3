name: Community verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build production site
        run: npm run build
      - name: Verify production routes and admin sessions
        run: npm run test:smoke
      - name: Verify real Controller wallet read ownership
        env:
          ATOMIC_CONTROLLER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/controller-wallet-browser.mjs ci-controller-wallet-browser-proof.json
      - name: Upload sanitized Controller wallet browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-controller-wallet-browser-proof
          path: ci-controller-wallet-browser-proof.json
          if-no-files-found: error
          retention-days: 14
